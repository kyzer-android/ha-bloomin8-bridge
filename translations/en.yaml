configuration:
  immich:
    name: Immich
    description: |-
      Connection to your Immich server.
      • server: full URL with the port, e.g. http://192.168.1.205:2283
      • api_key: Immich API key. To create one — avatar (top right in
        Immich) → Account settings → "API Keys" tab → "New API Key".
        Permissions to check: asset.read, album.read, albumAsset.create
        (adding to albums, required for person_to_album) — or "Select
        all" if you'd rather not hunt for each one. Copy it right away,
        Immich never shows it again afterwards.

  person_to_album:
    name: Person → Album
    description: |-
      Automatically adds photos of a recognized person to an Immich
      album.
      • enabled: enables the scheduled run.
      • schedule: cron expression, e.g. "*/30 * * * *" = every 30
        minutes.
      • links: one row per person to track —
          - description: free-text label to tell rows apart (e.g. "My
            son"), not used by the script itself.
          - person_id: the person's UUID in Immich. Explore by people →
            click the person → the UUID is in the URL after /people/
            (e.g. a1b2c3d4-e5f6-7890-abcd-ef1234567890).
          - album_id: UUID of the target album. Open the album → the
            UUID is in the URL after /albums/
            (e.g. 98765432-1abc-4def-9012-345678abcdef).

  bloomin8:
    name: BLOOMIN8 optimization
    description: |-
      Filters the source album by orientation and optimizes photos for
      the frame's Spectra 6 e-ink display.
      • enabled: enables the scheduled run.
      • schedule: cron, e.g. "0 4 * * *" = every day at 4am.
      • album_id: UUID of the source Immich album (same method as
        person_to_album.links.album_id above).
      • orientation: portrait or landscape — determines the subfolder
        (portrait/ or landscape/) and must match the orientation set on
        the bloomin8_pull side.
      • destination_path: folder under /media watched by bloomin8_pull,
        e.g. /media/bloomin8 (portrait/landscape subfolders are created
        automatically).
      • resolution_width / resolution_height: target size in pixels,
        e.g. 1600 × 1200.
      • color_gamma: gamma correction before dithering, 1.0 = neutral,
        e.g. 0.85 to lighten.
      • color_saturation: saturation multiplier, 1.0 = neutral, e.g.
        1.15 for more vivid colors.
      • color_lift / color_lift_threshold: lifts dark tones below the
        brightness threshold (0-255) to avoid crushed blacks, e.g.
        lift=13, threshold=90.

  frame:
    name: BLOOMIN8 frame
    description: |-
      Network details for the frame, used for manual/auto refresh.
      • ip: just the address, WITHOUT http:// in front, e.g.
        192.168.1.136 (same one used in bloomin8_pull).
      • token: the same access_token configured on the bloomin8_pull
        side (custom_yaml/bloomin8.yaml).

  relance:
    name: Refresh & HA integration
    description: |-
      Triggers a frame refresh and, optionally, edits the bloomin8_pull
      integration's YAML file from this panel.
      • ha_url: Home Assistant URL, e.g.
        http://homeassistant.local:8123
      • ha_yaml_path: path relative to /config, e.g.
        custom_yaml/bloomin8.yaml — leave empty if you don't use the
        built-in YAML editor.
      • ha_device_id: the KEY (not the "name:") under "devices:" in your
        bloomin8_pull YAML — the frame's serial number, e.g.
        CB29695B3322ADA29D9578BD1A7B59F2.
      • auto_relance_enabled: automatically triggers a refresh after the
        frame has been silent for a while (see
        auto_relance_after_hours).
      • auto_relance_after_hours: hours without a successful pull before
        an auto-refresh, e.g. 12.
      • notify_service: FULL HA service name, including the "notify."
        prefix. Correct: notify.mobile_app_sm_g991b. Wrong:
        mobile_app_sm_g991b (won't work). Find it under Developer Tools
        → Actions, searching for "notify". Empty = no notification.
