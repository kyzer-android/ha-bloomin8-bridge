configuration:
  immich:
    name: Immich
    description: |-
      Connexion à ton serveur Immich.
      • server : URL complète avec le port, ex. http://192.168.1.205:2283
      • api_key : clé API Immich. Pour la créer — avatar (en haut à
        droite dans Immich) → Paramètres du compte → onglet "Clés API" →
        "Nouvelle clé API". Droits à cocher : asset.read, album.read,
        albumAsset.create (ajout aux albums, requis pour
        person_to_album) — ou "Tout sélectionner" si tu ne veux pas
        chercher chaque droit. Copie-la tout de suite, Immich ne la
        raffiche plus jamais après.

  person_to_album:
    name: Person → Album
    description: |-
      Ajoute automatiquement les photos d'une personne reconnue à un
      album Immich.
      • enabled : active l'exécution planifiée.
      • schedule : expression cron, ex. "*/30 * * * *" = toutes les 30
        minutes.
      • links : une ligne par personne à suivre —
          - description : libellé libre pour t'y retrouver (ex. "Mon
            fils"), non utilisé par le script.
          - person_id : UUID de la personne dans Immich. Explorer par
            personnes → clique la personne → l'UUID est dans l'URL après
            /people/ (ex. a1b2c3d4-e5f6-7890-abcd-ef1234567890).
          - album_id : UUID de l'album cible. Ouvre l'album → l'UUID est
            dans l'URL après /albums/
            (ex. 98765432-1abc-4def-9012-345678abcdef).

  bloomin8:
    name: Optimisation BLOOMIN8
    description: |-
      Filtre l'album source par orientation et optimise les photos pour
      l'écran e-ink Spectra 6 du cadre.
      • enabled : active l'exécution planifiée.
      • schedule : cron, ex. "0 4 * * *" = tous les jours à 4h00.
      • album_id : UUID de l'album Immich source (même méthode que
        person_to_album.links.album_id ci-dessus).
      • orientation : portrait ou landscape — détermine le sous-dossier
        (portrait/ ou landscape/) et doit correspondre à l'orientation
        configurée côté bloomin8_pull.
      • destination_path : dossier sous /media surveillé par
        bloomin8_pull, ex. /media/bloomin8 (les sous-dossiers
        portrait/landscape sont créés automatiquement).
      • resolution_width / resolution_height : taille cible en pixels,
        ex. 1600 × 1200.
      • color_gamma : correction gamma avant dithering, 1.0 = neutre,
        ex. 0.85 pour éclaircir.
      • color_saturation : multiplicateur de saturation, 1.0 = neutre,
        ex. 1.15 pour des couleurs plus vives.
      • color_lift / color_lift_threshold : rehausse les tons sombres
        en dessous du seuil de luminosité (0-255) pour éviter les
        aplats noirs bouchés, ex. lift=13, threshold=90.

  frame:
    name: Cadre BLOOMIN8
    description: |-
      Coordonnées réseau du cadre, pour la relance manuelle/auto.
      • ip : juste l'adresse, SANS http:// devant, ex. 192.168.1.136
        (la même que dans bloomin8_pull).
      • token : le même access_token que celui configuré côté
        bloomin8_pull (custom_yaml/bloomin8.yaml).

  relance:
    name: Relance & intégration HA
    description: |-
      Pilotage de la relance du pull et, en option, édition du YAML de
      l'intégration bloomin8_pull depuis ce panneau.
      • ha_url : URL de Home Assistant, ex.
        http://homeassistant.local:8123
      • ha_yaml_path : chemin relatif à /config, ex.
        custom_yaml/bloomin8.yaml — vide si tu n'utilises pas l'éditeur
        YAML intégré.
      • ha_device_id : la CLÉ (pas le "name:") sous "devices:" dans ton
        YAML bloomin8_pull — le numéro de série du cadre, ex.
        CB29695B3322ADA29D9578BD1A7B59F2.
      • auto_relance_enabled : relance automatiquement après une
        période de silence du cadre (voir auto_relance_after_hours).
      • auto_relance_after_hours : nombre d'heures sans pull réussi
        avant relance auto, ex. 12.
      • notify_service : nom COMPLET du service HA, préfixe "notify."
        inclus. Correct : notify.mobile_app_sm_g991b. Incorrect :
        mobile_app_sm_g991b (ne marchera pas). Trouvable dans Outils de
        développement → Actions, en cherchant "notify". Vide = pas de
        notification.
